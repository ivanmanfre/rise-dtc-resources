<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RISE DTC · Content Desk</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffc71d">
<style>
  html, body { margin: 0; height: 100%; background: #fff; font-family: 'Manrope', system-ui, -apple-system, sans-serif; }
  /* Gated board embed. The framed app shows its own email + 6-digit-code sign-in
     screen when there is no session; the code is redeemed IN the frame, so login
     completes here on resources.risedtc.com without leaving the page. */
  #frame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  #splash {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: .75rem; background: #fff;
    transition: opacity .4s ease; z-index: 2;
  }
  #splash.hide { opacity: 0; pointer-events: none; }
  #splash .mark { font-weight: 800; letter-spacing: .08em; font-size: .95rem; color: #0e1512; }
  #splash .sub { font-size: .8rem; color: #8a8a80; letter-spacing: .04em; }
  #splash .dot { width: 8px; height: 8px; border-radius: 50%; background: #ffc71d; animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .35; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.1); } }
</style>
</head>
<body>
  <div id="splash">
    <div class="dot"></div>
    <div class="mark">RISE DTC</div>
    <div class="sub">Loading your content desk…</div>
  </div>
  <iframe id="frame" title="RISE DTC Content Desk"
    src="https://ivanmanfredi.com/client/risedtc-com"
    allow="clipboard-write"></iframe>
  <script>
    // Deep-link support: /panel/?cat=post&topic=personal (and the /panel/content/<x>/
    // pages) forward the filters into the framed board, which reads them on load.
    // cat = format (post/carousel/video/lm), topic = pillar (personal/teardown/...).
    (function () {
      var p = new URLSearchParams(location.search);
      var q = [];
      ['cat', 'topic', 'aim'].forEach(function (k) {
        var v = p.get(k);
        if (v && /^[a-z_]+$/.test(v)) q.push(k + '=' + v);
      });
      // post = a draft id (full uuid or >=6-char prefix): the board opens that post's
      // window on load, so /panel/?post=1f5d865a is a shareable direct link.
      var post = p.get('post');
      if (post && /^[0-9a-fA-F-]{6,36}$/.test(post)) q.push('post=' + post);
      if (q.length) document.getElementById('frame').src = 'https://ivanmanfredi.com/client/risedtc-com?' + q.join('&');
    })();
    // The board reports filter clicks (cb-filter) so the address bar tracks the view:
    // pretty path when one exists, query params on /panel/ otherwise.
    window.addEventListener('message', function (e) {
      if (e.origin !== 'https://ivanmanfredi.com') return;
      var d = e.data || {};
      // cb-post: the board reports the opened post window so the address bar becomes a
      // shareable /panel/?post=<id> link; null id (window closed) returns to /panel/.
      if (d.type === 'cb-post') {
        if (typeof d.id === 'string' && /^[0-9a-fA-F-]{6,36}$/.test(d.id)) {
          history.replaceState(null, '', '/panel/?post=' + d.id.slice(0, 8));
        } else {
          history.replaceState(null, '', '/panel/');
        }
        return;
      }
      if (d.type !== 'cb-filter') return;
      var FORMAT_PATH = { post: 'posts', carousel: 'carousels', video: 'videos', lm: 'lead-magnets' };
      var ok = function (v) { return (typeof v === 'string' && /^[a-z_]+$/.test(v)) ? v : 'all'; };
      var cat = ok(d.cat), topic = ok(d.topic), aim = ok(d.aim);
      var url;
      if (cat === 'all' && topic === 'all' && aim === 'all') url = '/panel/';
      else if (cat === 'all' && topic === 'personal' && aim === 'all') url = '/panel/content/personal/';
      else if (topic === 'all' && aim === 'all' && FORMAT_PATH[cat]) url = '/panel/content/' + FORMAT_PATH[cat] + '/';
      else {
        var q = [];
        if (cat !== 'all') q.push('cat=' + cat);
        if (topic !== 'all') q.push('topic=' + topic);
        if (aim !== 'all') q.push('aim=' + aim);
        url = '/panel/?' + q.join('&');
      }
      history.replaceState(null, '', url);
    });
  </script>
  <script>
    var f = document.getElementById('frame'), s = document.getElementById('splash');
    f.addEventListener('load', function () { s.classList.add('hide'); });
    setTimeout(function () { s.classList.add('hide'); }, 6000);
  </script>
</body>
</html>
